name: Prueba de token en runner local

on:
  push:

permissions: {}

jobs:
  comparar-token:
    name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Comprobar coincidencia de los tokens
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:DEV_TOKEN)) {
            Write-Output "ERROR: DEV_TOKEN no está disponible."
            exit 1
          }

          if ([string]::IsNullOrEmpty($env:LOCAL_DEV_TOKEN)) {
            Write-Output "ERROR: LOCAL_DEV_TOKEN no está disponible."
            exit 1
          }

          if ($env:DEV_TOKEN -ceq $env:LOCAL_DEV_TOKEN) {
            Write-Output "CORRECTO: DEV_TOKEN y LOCAL_DEV_TOKEN coinciden."
            exit 0
          } else {
            Write-Output "ERROR: DEV_TOKEN y LOCAL_DEV_TOKEN no coinciden."
            exit 1
          }